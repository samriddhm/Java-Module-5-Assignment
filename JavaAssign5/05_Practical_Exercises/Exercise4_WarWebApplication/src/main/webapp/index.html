<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <h1>Student Portal</h1>
    <p>A small web application packaged as a <strong>WAR</strong> by the <code>maven-war-plugin</code>.</p>

    <h2>Say hello</h2>
    <form action="hello" method="get">
        <input name="name" placeholder="Your name">
        <button type="submit">Greet me</button>
    </form>

    <h2>Pages</h2>
    <ul>
        <li><a href="students">Student list (add students)</a> &mdash; <code>StudentServlet</code></li>
        <li><a href="hello?name=Shrey">Hello, Shrey</a> &mdash; <code>HelloServlet</code></li>
        <li><a href="build-info.txt">Build info</a> &mdash; generated by Maven resource filtering</li>
    </ul>
</main>
</body>
</html>
